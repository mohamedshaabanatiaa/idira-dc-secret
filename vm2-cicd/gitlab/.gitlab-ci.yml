# Pet store release record from gitlab.com through the runner on VM2.
# Non-disruptive by default: it records the release on the Deployment
# (metadata only, no pod restart) and runs a smoke test.
# Set RESTART=true to do a real rolling restart (safe: readiness probe,
# old pod serves until the new one is Ready, auto-rollback on failure).
# The job proves who it is with a GitLab ID token. No CI variable holds a credential.
stages: [deploy]

variables:
  RESTART: "false"

deploy-petstore:
  stage: deploy
  tags: [idira-vm2]
  id_tokens:
    CONJUR_JWT:
      aud: conjur
  script:
    - set -euo pipefail
    - echo "Job identity = project ${CI_PROJECT_PATH}, ref ${CI_COMMIT_REF_NAME}"
    - KUBE_SERVER=$(conjur-fetch gitlab prod/cicd/kube-server)
    - conjur-fetch gitlab prod/cicd/kube-ca > ca.pem
    - KUBE_TOKEN=$(conjur-fetch gitlab prod/cicd/gitlab-token)
    - K="kubectl --server=$KUBE_SERVER --certificate-authority=ca.pem --token=$KUBE_TOKEN -n petstore"
    - echo "== Preflight"
    - test "$($K get deploy petstore -o jsonpath='{.status.readyReplicas}')" -ge 1
    - echo "== Record release (metadata only, pods untouched)"
    - $K annotate deploy/petstore idira.release="gitlab-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}" --overwrite
    - |
      if [ "$RESTART" = "true" ]; then
        $K rollout restart deploy/petstore
        $K rollout status deploy/petstore --timeout=240s || { $K rollout undo deploy/petstore; exit 1; }
      fi
    - echo "== Smoke test"
    - $K get deploy petstore -o jsonpath='{.metadata.annotations.idira\.release}{"\n"}'
    - echo "== Out of scope (expected denials)"
    - kubectl --server=$KUBE_SERVER --certificate-authority=ca.pem --token=$KUBE_TOKEN -n boa get deploy 2>&1 | tail -1 || true
    - conjur-fetch gitlab prod/cicd/jenkins-token >/dev/null || true
  after_script:
    - rm -f ca.pem
