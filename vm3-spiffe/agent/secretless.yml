# Secretless Broker for the VM3 ops agent. Same connector as the k3s support agent.
# It logs in to Secrets Manager with the broker's SPIFFE identity, fetches the Claude key
# on EVERY request, adds it as x-api-key, and sends the call upstream over https.
version: "2"
services:
  claude:
    connector: generic_http
    listenOn: tcp://127.0.0.1:8090
    credentials:
      apikey:
        from: conjur
        get: prod/ai/anthropic-api-key
    config:
      headers:
        x-api-key: "{{ .apikey }}"
      forceSSL: true
      upstreamURL: "http://api.anthropic.com"
      authenticateURLsMatching:
        - ^http://api\.anthropic\.com
