# Deploy credentials for the two CI tools. Values are short-lived Kubernetes
# service account tokens, written by vm1-k8s/25-cicd-deployers.sh.
# Loaded into the root branch.
- !policy
  id: bank/cicd
  body:
  - !variable kube-server
  - !variable kube-ca
  - !variable jenkins/kube-token      # can deploy Bank of Anthos only
  - !variable gitlab/kube-token       # can deploy the pet store only

  - !group jenkins-consumers
  - !permit
    role: !group jenkins-consumers
    privileges: [ read, execute ]
    resources: [ !variable kube-server, !variable kube-ca, !variable jenkins/kube-token ]

  - !group gitlab-consumers
  - !permit
    role: !group gitlab-consumers
    privileges: [ read, execute ]
    resources: [ !variable kube-server, !variable kube-ca, !variable gitlab/kube-token ]
