# =============================================================================
# prod.yml  -  Production: secrets, workload identities, and who can read what.
# Load from the Windows CLI as admin (after root.yml):
#     conjur policy load -b prod -f prod.yml
#
# Four building blocks:
#   variable = a secret          host  = one workload identity
#   layer    = a group of hosts  permit = "this layer may read + use these secrets"
# Everything here lives under prod/ (e.g. prod/boa/accounts-db/password).
# =============================================================================

# ---------------------------------------------------------------- SECRETS
- !variable boa/accounts-db/password       # Bank of Anthos
- !variable boa/accounts-db/uri
- !variable boa/ledger-db/password

- !variable petstore/db/host               # Pet store
- !variable petstore/db/port
- !variable petstore/db/username
- !variable petstore/db/password

- !variable cicd/kube-server               # Deploy access for pipelines
- !variable cicd/kube-ca
- !variable cicd/jenkins-token
- !variable cicd/gitlab-token

- !variable ai/anthropic-api-key           # Claude API key for agents

- !variable batch/core-banking-api-key     # VM batch job (SPIFFE identity, VM3)

# -------------------------------------------- IDENTITIES (hosts + layers)
# Kubernetes pods (k3s on VM1). Host id = the pod's service account.
- !layer k8s/boa
- !layer k8s/petstore
- !host
  id: k8s/system:serviceaccount:boa:secrets-provider
  annotations:                                     # extra checks on the pod's token
    authn-jwt/k3s/kubernetes.io/namespace: boa
    authn-jwt/k3s/kubernetes.io/serviceaccount/name: secrets-provider
- !host
  id: k8s/system:serviceaccount:petstore:petstore-app
  annotations:
    authn-jwt/k3s/kubernetes.io/namespace: petstore
    authn-jwt/k3s/kubernetes.io/serviceaccount/name: petstore-app
- !grant { role: !layer k8s/boa,      member: !host k8s/system:serviceaccount:boa:secrets-provider }
- !grant { role: !layer k8s/petstore, member: !host k8s/system:serviceaccount:petstore:petstore-app }

# Jenkins pipelines (VM2)
- !layer jenkins/pipelines
- !host
  id: jenkins/boa-deploy
  annotations: { authn-jwt/jenkins/jenkins_full_name: idira/boa-deploy }
- !host
  id: jenkins/idira
  annotations: { authn-jwt/jenkins/jenkins_full_name: idira }
- !grant { role: !layer jenkins/pipelines, members: [ !host jenkins/boa-deploy, !host jenkins/idira ] }

# GitLab pipelines (gitlab.com, runner on VM2). Only the main branch.
- !layer gitlab/pipelines
- !host
  id: gitlab/mohamedshaabanatiaa/idira-petstore-deploy
  annotations: { authn-jwt/gitlab/ref: main }
- !grant { role: !layer gitlab/pipelines, member: !host gitlab/mohamedshaabanatiaa/idira-petstore-deploy }

# AI agents: pods in namespace "agents" on k3s. Same signed identity as any pod,
# one service account per agent. No API key anywhere.
- !layer k8s/agents
- !host
  id: k8s/system:serviceaccount:agents:support-agent
  annotations:
    authn-jwt/k3s/kubernetes.io/namespace: agents
    authn-jwt/k3s/kubernetes.io/serviceaccount/name: support-agent
- !host
  id: k8s/system:serviceaccount:agents:rogue-agent
  annotations:
    authn-jwt/k3s/kubernetes.io/namespace: agents
    authn-jwt/k3s/kubernetes.io/serviceaccount/name: rogue-agent
- !grant
  role: !layer k8s/agents
  members:
  - !host k8s/system:serviceaccount:agents:support-agent
  - !host k8s/system:serviceaccount:agents:rogue-agent

# VM workloads with a SPIFFE identity, issued by open-source SPIRE on VM3.
# Login sends the host id in the URL; the token's "sub" must equal the SPIFFE ID below.
- !layer spiffe/vms
- !host
  id: spiffe/settlement-batch
  annotations:
    authn-jwt/spire/sub: "spiffe://bank.local/batch/settlement"
- !host
  id: spiffe/ops-agent              # AI agent on VM3: identity held by its Secretless broker only
  annotations:
    authn-jwt/spire/sub: "spiffe://bank.local/agents/ops-agent"
- !grant
  role: !layer spiffe/vms
  members: [ !host spiffe/settlement-batch, !host spiffe/ops-agent ]

# ------------------------------------------- WHO CAN READ WHAT (the rules)
- !permit
  role: !layer k8s/boa
  privileges: [ read, execute ]
  resources: [ !variable boa/accounts-db/password, !variable boa/accounts-db/uri, !variable boa/ledger-db/password ]

- !permit
  role: !layer k8s/petstore
  privileges: [ read, execute ]
  resources: [ !variable petstore/db/host, !variable petstore/db/port, !variable petstore/db/username, !variable petstore/db/password ]

- !permit
  role: !layer jenkins/pipelines
  privileges: [ read, execute ]
  resources: [ !variable cicd/kube-server, !variable cicd/kube-ca, !variable cicd/jenkins-token ]

- !permit
  role: !layer gitlab/pipelines
  privileges: [ read, execute ]
  resources: [ !variable cicd/kube-server, !variable cicd/kube-ca, !variable cicd/gitlab-token ]

- !permit
  role: !host k8s/system:serviceaccount:agents:support-agent
  privileges: [ read, execute ]
  resources: [ !variable ai/anthropic-api-key ]

# rogue-agent: no rule. It can log in, it can read nothing.

- !permit
  role: !host spiffe/settlement-batch
  privileges: [ read, execute ]
  resources: [ !variable batch/core-banking-api-key ]

- !permit
  role: !host spiffe/ops-agent
  privileges: [ read, execute ]
  resources: [ !variable ai/anthropic-api-key ]
